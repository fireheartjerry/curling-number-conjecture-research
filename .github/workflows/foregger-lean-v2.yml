name: Foregger Lean Kernel Check v2

on:
  push:
    branches: [foregger-lean-proof]
    paths:
      - 'foregger/**'
      - '.github/workflows/foregger-lean-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: foregger
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Resolve dependencies
        working-directory: foregger
        run: lake update
      - name: Fetch mathlib cache
        working-directory: foregger
        run: lake exe cache get
      - name: Build
        working-directory: foregger
        run: lake build
      - name: Reject admissions
        working-directory: foregger
        run: |
          if grep -RInE '(^|[^A-Za-z])(sorry|admit|axiom)([^A-Za-z]|$)' --include='*.lean' .; then
            echo 'Forbidden proof admission found.'
            exit 1
          fi
